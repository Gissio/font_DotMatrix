<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DotMatrix</title>
<style>
:root {
	--bg: #f4f4f1;
	--fg: #161616;
	--muted: #707070;
	--line: #dededa;
	--alt: #e9e9e4;
	--hover: #d6d6cf;
	--accent: #1f6fe0;
	--accent-fg: #ffffff;
	--space: #c9dcf7;
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--bg: #151515;
		--fg: #e9e9e9;
		--muted: #8a8a8a;
		--line: #262626;
		--alt: #1d1d1d;
		--hover: #333333;
		--accent: #4f9bff;
		--accent-fg: #0b0b0b;
		--space: #22374f;
		color-scheme: dark;
	}
}
:root[data-theme="dark"] {
	--bg: #151515;
	--fg: #e9e9e9;
	--muted: #8a8a8a;
	--line: #262626;
	--alt: #1d1d1d;
	--hover: #333333;
	--accent: #4f9bff;
	--accent-fg: #0b0b0b;
	--space: #22374f;
	color-scheme: dark;
}

* {
	box-sizing: border-box;
}
html {
	-webkit-text-size-adjust: 100%;
}
body {
	margin: 0;
	background: var(--bg);
	color: var(--fg);
	font: 16px/24px "UI", ui-monospace, monospace;
	font-synthesis: none;
}
button,
input {
	font: inherit;
	color: inherit;
}

/* Controls */

#bar {
	position: sticky;
	top: 0;
	z-index: 2;
	background: var(--bg);
	border-bottom: 1px solid var(--line);
	padding: 8px 16px 0;
}
.row {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 8px 24px;
	margin-bottom: 8px;
}
#families {
	display: flex;
	gap: 4px;
	margin: 0 auto 0 0;
	font-size: inherit;
	font-weight: inherit;
}
#families button {
	border: 0;
	background: none;
	padding: 0 8px;
	cursor: pointer;
	color: var(--muted);
}
#families button[aria-pressed="true"] {
	background: var(--fg);
	color: var(--bg);
}
#families:only-child button,
#families button:only-child {
	cursor: default;
	padding: 0;
}
#families button:only-child[aria-pressed="true"] {
	background: none;
	color: var(--fg);
}
#search {
	width: 192px;
	border: 1px solid var(--line);
	background: var(--bg);
	padding: 0 8px;
	border-radius: 0;
	outline: none;
}
#search:focus {
	border-color: var(--accent);
}
#search::placeholder {
	color: var(--muted);
}
.tool {
	border: 0;
	background: none;
	padding: 0;
	cursor: pointer;
	color: var(--muted);
}
.tool:hover {
	color: var(--fg);
}

.axis {
	display: block;
	width: 160px;
	user-select: none;
}
.axis span {
	display: flex;
	justify-content: space-between;
	color: var(--muted);
}
.axis.changed span {
	color: var(--fg);
}
.axis output {
	font-variant-numeric: tabular-nums;
}
input[type="range"] {
	-webkit-appearance: none;
	appearance: none;
	display: block;
	width: 100%;
	height: 16px;
	margin: 0;
	background: none;
	cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track {
	height: 2px;
	background: linear-gradient(var(--accent), var(--accent)) 0 / var(--fill, 0%) 100% no-repeat, var(--line);
}
input[type="range"]::-moz-range-track {
	height: 2px;
	background: linear-gradient(var(--accent), var(--accent)) 0 / var(--fill, 0%) 100% no-repeat, var(--line);
}
input[type="range"]::-webkit-slider-thumb {
	-webkit-appearance: none;
	width: 8px;
	height: 16px;
	margin-top: -7px;
	border: 0;
	border-radius: 0;
	background: var(--fg);
}
input[type="range"]::-moz-range-thumb {
	width: 8px;
	height: 16px;
	border: 0;
	border-radius: 0;
	background: var(--fg);
}
input[type="range"]:focus-visible {
	outline: 1px solid var(--accent);
	outline-offset: 2px;
}

#nav {
	display: flex;
	gap: 16px;
	overflow-x: auto;
	scrollbar-width: none;
	margin: 0 -16px;
	white-space: nowrap;
}
/* Room to center the first and last links */
#nav::before,
#nav::after {
	content: "";
	flex: 0 0 50%;
}
#nav::-webkit-scrollbar {
	display: none;
}
#nav a {
	padding-bottom: 8px;
	color: var(--muted);
	text-decoration: none;
}
#nav a:hover,
#nav a.current {
	color: var(--fg);
}

/* Glyphs */

#glyphs {
	padding: 0 16px 48px;
	font-family: var(--family);
}
#glyphs.loading {
	visibility: hidden;
}
section h2 {
	position: sticky;
	top: var(--bar-height, 0);
	z-index: 1;
	margin: 0;
	padding: 16px 0 8px;
	background: var(--bg);
	font: inherit;
	font-family: "UI", ui-monospace, monospace;
	color: var(--muted);
}
/* Off-screen sections and cells skip layout, so an axis change only reshapes
   the glyphs in view. Cells can, as every glyph's ink fits its cell. */
section {
	scroll-margin-top: var(--bar-height, 0);
	content-visibility: auto;
}
.grid {
	display: grid;
	grid-template-columns: repeat(auto-fill, var(--cell-width));
	gap: 1px;
	background: var(--line);
	border: 1px solid var(--line);
	width: fit-content;
	max-width: 100%;
}
.g {
	display: block;
	width: var(--cell-width);
	height: var(--cell-height);
	padding: var(--cell-top) 0 var(--cell-bottom);
	border: 0;
	background: var(--bg);
	font-size: var(--size);
	line-height: var(--line-height);
	vertical-align: top;
	text-align: center;
	white-space: pre;
	cursor: pointer;
	font-family: inherit;
	-webkit-tap-highlight-color: transparent;
	content-visibility: auto;
	contain-intrinsic-size: var(--cell-width) var(--cell-height);
}
.g.alt {
	background: var(--alt);
}
.g:hover {
	background: var(--hover);
}
.g:focus-visible {
	outline: 1px solid var(--accent);
	outline-offset: -1px;
}
.g.copied {
	background: var(--accent);
	color: var(--accent-fg);
}
.g.space span {
	background: var(--space);
	outline: 1px dashed var(--muted);
	outline-offset: -1px;
	padding-left: 1px;
}
.g[hidden],
section[hidden],
#nav a[hidden] {
	display: none;
}

#status {
	position: fixed;
	left: 0;
	right: 0;
	bottom: 0;
	z-index: 2;
	min-height: 32px;
	padding: 4px 16px;
	background: var(--bg);
	border-top: 1px solid var(--line);
	color: var(--muted);
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
}
#status b {
	font-weight: inherit;
	color: var(--fg);
}

@media (max-width: 600px) {
	.row {
		gap: 8px 16px;
	}
	#search,
	.axis {
		width: 128px;
	}
}
</style>
</head>
<body>
<header id="bar">
	<div class="row">
		<h1 id="families"></h1>
		<input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
		<label id="size" class="axis"></label>
		<button id="reset" class="tool" type="button">Reset</button>
		<button id="theme" class="tool" type="button">Theme</button>
	</div>
	<nav id="nav"></nav>
</header>
<main id="glyphs" class="loading"></main>
<footer id="status"></footer>

// END GLYPHS

const SIZE = { tag: "size", name: "Size", min: 8, default: 32, max: 128, step: 4 };
const STORAGE_KEY = "glyphs:" + location.pathname;

const bar = document.getElementById("bar");
const familyBar = document.getElementById("families");
const nav = document.getElementById("nav");
const main = document.getElementById("glyphs");
const status = document.getElementById("status");
const search = document.getElementById("search");

let settings = { family: 0, theme: null };
try {
	Object.assign(settings, JSON.parse(localStorage.getItem(STORAGE_KEY)) || {});
} catch (e) {}
if (!FAMILIES[settings.family]) settings.family = 0;

function save() {
	try {
		localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
	} catch (e) {}
}

// Fonts

FAMILIES.forEach((family, index) => {
	document.fonts.add(new FontFace(`F${index}`, `url("${family.url}")`));
});
document.fonts.add(new FontFace("UI", `url("${FAMILIES[0].url}")`));

// Glyph table

const glyphs = [];
const sections = [];
for (const [title, entries] of SECTIONS) {
	const id = title.toLowerCase().replace(/\W+/g, "-");
	const section = document.createElement("section");
	section.id = id;
	const heading = document.createElement("h2");
	heading.textContent = title;
	const grid = document.createElement("div");
	grid.className = "grid";
	section.append(heading, grid);

	const link = document.createElement("a");
	link.href = "#" + id;
	link.textContent = title;
	nav.append(link);

	const cells = [];
	let alt = true;
	for (const [code, name, lead = 0, mask = -1] of entries) {
		if (lead) alt = !alt;
		const char = String.fromCodePoint(code);
		const cell = document.createElement("button");
		cell.type = "button";
		cell.className = "g";
		if (alt) cell.classList.add("alt");
		cell.dataset.index = glyphs.length;
		const glyph = {
			code,
			name,
			words: name.split(/[\s-]+/),
			char,
			mask,
			base: char.normalize("NFD")[0],
			cell,
			section: cells,
		};
		if (title.endsWith("marks")) {
			// The mark is a left-to-right run of its own: shaped with the
			// circle in a right-to-left (Hebrew) run, it lands beside it
			glyph.circle = document.createTextNode("◌");
			const mark = document.createElement("bdo");
			mark.dir = "ltr";
			mark.textContent = char;
			cell.append(glyph.circle, mark);
		} else if (title === "Spaces and invisibles") {
			cell.classList.add("space");
			const span = document.createElement("span");
			span.textContent = char;
			cell.append(span);
		}
		if (!cell.firstChild) cell.textContent = char;
		glyphs.push(glyph);
		cells.push(glyph);
		grid.append(cell);
	}
	sections.push({ section, link, cells, visible: cells.length });
	main.append(section);
}

// Dotted circle under combining marks, when the font has one
function updateMarkBase() {
	const circle = glyphs.find((glyph) => glyph.code === 0x25CC);
	const hasCircle = circle && circle.mask & (1 << settings.family);
	for (const glyph of glyphs) {
		if (glyph.circle) glyph.circle.data = hasCircle ? "◌" : " ";
	}
}

// Families

function setFamily(index) {
	settings.family = index;
	main.style.setProperty("--family", `F${index}, UI`);
	for (const button of familyBar.children) {
		button.setAttribute("aria-pressed", button.dataset.index == index);
	}
	updateMarkBase();
	updateCells();
	filter();
	save();
}

FAMILIES.forEach((family, index) => {
	const button = document.createElement("button");
	button.type = "button";
	button.textContent = family.name;
	button.dataset.index = index;
	button.addEventListener("click", () => setFamily(index));
	familyBar.append(button);
});

// Size

const sliders = {};
for (const axis of [SIZE]) {
	const label = document.getElementById(axis.tag);
	const text = document.createElement("span");
	const output = document.createElement("output");
	text.append(axis.name, output);
	const input = document.createElement("input");
	input.type = "range";
	input.min = axis.min;
	input.max = axis.max;
	input.step = axis.step || 1;
	input.value = settings[axis.tag] ?? axis.default;
	input.addEventListener("input", () => updateAxis(axis));
	label.addEventListener("dblclick", () => {
		input.value = axis.default;
		updateAxis(axis);
	});
	label.append(text, input);
	sliders[axis.tag] = { axis, input, output, label };
}

function updateAxis(axis) {
	const { input, output, label } = sliders[axis.tag];
	const value = Number(input.value);
	settings[axis.tag] = value;
	output.textContent = `${value}px`;
	label.classList.toggle("changed", value !== axis.default);
	input.style.setProperty("--fill", `${(100 * (value - axis.min)) / (axis.max - axis.min)}%`);
	updateCells();
	save();
}

// Cell size: room for the family's widest glyph, and for its highest and
// lowest ink around the line. Cells are whole pixels, so the grid lines stay
// sharp.
function updateCells() {
	const size = Number(sliders.size.input.value);
	const { box, ascent, descent, top, bottom } = FAMILIES[settings.family];
	main.style.setProperty("--size", `${size}px`);
	main.style.setProperty("--cell-width", `${Math.ceil(size * box)}px`);
	main.style.setProperty("--line-height", `${size * (ascent + descent)}px`);
	main.style.setProperty("--cell-top", `${size * (top - ascent)}px`);
	main.style.setProperty("--cell-bottom", `${size * (bottom - descent)}px`);
	main.style.setProperty("--cell-height", `${Math.ceil(size * (top + bottom))}px`);
	updateSectionSizes();
}

// Off-screen sections are skipped, so they get their exact height from here:
// the heading and the rows of cells. This keeps the scrollbar and the jumps
// to sections right.
function updateSectionSizes() {
	const heading = getComputedStyle(sections[0].section.firstChild);
	const headingHeight =
		parseFloat(heading.paddingTop) + parseFloat(heading.paddingBottom) + parseFloat(heading.lineHeight);
	const mainStyle = getComputedStyle(main);
	const cellWidth = parseFloat(mainStyle.getPropertyValue("--cell-width"));
	const cellHeight = parseFloat(mainStyle.getPropertyValue("--cell-height"));
	// Grid width without the page padding and the grid border; cells have 1px gaps
	const width = main.clientWidth - parseFloat(mainStyle.paddingLeft) - parseFloat(mainStyle.paddingRight) - 2;
	const columns = Math.max(1, Math.floor((width + 1) / (cellWidth + 1)));
	for (const entry of sections) {
		const rows = Math.ceil(entry.visible / columns);
		entry.section.style.containIntrinsicHeight = `${headingHeight + rows * (cellHeight + 1) + 1}px`;
	}
}

addEventListener("resize", updateSectionSizes);

document.getElementById("reset").addEventListener("click", () => {
	for (const { axis, input } of Object.values(sliders)) {
		input.value = axis.default;
		updateAxis(axis);
	}
});

// Theme

function applyTheme() {
	if (settings.theme) document.documentElement.dataset.theme = settings.theme;
	else delete document.documentElement.dataset.theme;
}

document.getElementById("theme").addEventListener("click", () => {
	const dark = getComputedStyle(document.documentElement).colorScheme === "dark";
	settings.theme = dark ? "light" : "dark";
	applyTheme();
	save();
});

// Search: a character finds itself and its accented forms, U+0041 or 0041 a
// code point, words a name

function matcher(query) {
	query = query.trim();
	if (!query) return () => true;
	const chars = Array.from(query);
	if (chars.length === 1) {
		return (glyph) => glyph.char === query || glyph.base === query;
	}
	const hex = query.match(/^(?:u\+|0x)?([0-9a-f]{2,6})$/i);
	const code = hex ? parseInt(hex[1], 16) : -1;
	// Each word starts a word of the name: "arrow" finds ARROWHEAD, not NARROW
	const words = query.toUpperCase().split(/[\s-]+/);
	return (glyph) =>
		glyph.code === code ||
		words.every((word) => glyph.words.some((nameWord) => nameWord.startsWith(word)));
}

function filter() {
	const matches = matcher(search.value);
	const bit = 1 << settings.family;
	for (const entry of sections) {
		let visible = 0;
		for (const glyph of entry.cells) {
			const shown = Boolean(glyph.mask & bit) && matches(glyph);
			glyph.cell.hidden = !shown;
			visible += shown;
		}
		entry.visible = visible;
		entry.section.hidden = entry.link.hidden = !visible;
	}
	updateSectionSizes();
	updateCurrent();
}

search.addEventListener("input", filter);
search.addEventListener("keydown", (event) => {
	if (event.key === "Escape") {
		search.value = "";
		filter();
	}
});

// Status line and copying

const idle = "Click a glyph to copy it";
let copiedTimer;

function describe(glyph) {
	const hex = glyph.code.toString(16).toUpperCase().padStart(4, "0");
	return `<b>U+${hex}</b> ${glyph.name}`;
}

function showGlyph(event) {
	const cell = event.target.closest(".g");
	if (cell) status.innerHTML = describe(glyphs[cell.dataset.index]);
}

main.addEventListener("mouseover", showGlyph);
main.addEventListener("focusin", showGlyph);
main.addEventListener("mouseleave", () => (status.textContent = idle));

async function copy(text) {
	try {
		await navigator.clipboard.writeText(text);
	} catch (e) {
		const area = document.createElement("textarea");
		area.value = text;
		area.style.position = "fixed";
		area.style.opacity = "0";
		document.body.append(area);
		area.select();
		document.execCommand("copy");
		area.remove();
	}
}

main.addEventListener("click", (event) => {
	const cell = event.target.closest(".g");
	if (!cell) return;
	const glyph = glyphs[cell.dataset.index];
	copy(glyph.char);
	for (const other of main.querySelectorAll(".copied")) other.classList.remove("copied");
	cell.classList.add("copied");
	status.innerHTML = `Copied ${describe(glyph)}`;
	clearTimeout(copiedTimer);
	copiedTimer = setTimeout(() => cell.classList.remove("copied"), 600);
});

// Sticky offsets and the current section

function updateCurrent() {
	const top = bar.offsetHeight + 1;
	let current = null;
	// At the bottom of the page, the last sections can't reach the top
	const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 1;
	for (const { section, link } of sections) {
		if (section.hidden) continue;
		if (atBottom || section.getBoundingClientRect().top <= top) current = link;
		else if (!current) current = link;
	}
	for (const { link } of sections) link.classList.toggle("current", link === current);
	centerLink(current, centeredLink ? "smooth" : "instant");
}

// Keeps the current section's link in the middle of the bar
let centeredLink = null;
function centerLink(link, behavior) {
	if (!link || (link === centeredLink && behavior === "smooth")) return;
	centeredLink = link;
	const linkBox = link.getBoundingClientRect();
	const navBox = nav.getBoundingClientRect();
	const offset = linkBox.left + linkBox.width / 2 - (navBox.left + navBox.width / 2);
	nav.scrollTo({ left: nav.scrollLeft + offset, behavior });
}

let scrollFrame;
addEventListener("scroll", () => {
	cancelAnimationFrame(scrollFrame);
	scrollFrame = requestAnimationFrame(updateCurrent);
}, { passive: true });

new ResizeObserver(() => {
	document.documentElement.style.setProperty("--bar-height", `${bar.offsetHeight}px`);
	centerLink(centeredLink, "instant");
}).observe(bar);

// Start

applyTheme();
for (const { axis } of Object.values(sliders)) updateAxis(axis);
setFamily(Math.min(settings.family, FAMILIES.length - 1));
status.textContent = idle;
Promise.race([
	document.fonts.load(`16px F${settings.family}`),
	new Promise((resolve) => setTimeout(resolve, 5000)),
]).then(() => main.classList.remove("loading"));
// The links change width when the UI font arrives
document.fonts.ready.then(() => centerLink(centeredLink, "instant"));
</script>
